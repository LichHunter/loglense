[package]
name = "loglense-mcp"
description = "loglense MCP stdio server exposing runs and events to agents"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
loglense-core = { path = "../loglense-core" }
loglense-runner = { path = "../loglense-runner" }
loglense-store = { path = "../loglense-store" }
rmcp.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints.clippy]
# Diagnostics discipline (docs/surfaces.md §5.1): a handler must never
# abort the server, and stdout carries only protocol frames.
unwrap_used = "deny"
expect_used = "deny"
print_stdout = "deny"
